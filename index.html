<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/isthishenry_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Henry Allan's design portfolio." />
    
    <!-- Open Graph / Link Preview -->
    <meta property="og:title" content="isthishenry" />
    <meta property="og:description" content="Henry Allan's design portfolio." />
    <meta property="og:image" content="https://isthishenry.com/preview.png" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="isthishenry" />
    <meta name="twitter:description" content="Henry Allan's design portfolio." />
    <meta name="twitter:image" content="https://isthishenry.com/preview.png" />
    
    <!-- Preload the fonts used on the first screen (faces are declared in src/index.css) -->
    <link rel="preload" href="/src/assets/fonts/Inter-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/src/assets/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/src/assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Preconnect to R2 CDN for faster asset loading -->
    <link rel="preconnect" href="https://cdn.isthishenry.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.isthishenry.com">
    
    <title>isthishenry</title>

    <!-- Start loading the site's content (pages, menu, media) while the code
         downloads; src/main.jsx waits for it. The editor at /crm loads its own. -->
    <script>
      if (!/^\/crm(\/|$)/.test(location.pathname)) {
        window.__site = fetch('/api/site')
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
